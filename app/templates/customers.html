{% extends 'base.html' %}{% block content %}<h1>Klanten</h1><p>Je relaties, netjes bij elkaar.</p><form class="filters" method="get"><label>Zoek klant<input name="q" value="{{ q }}" placeholder="Naam of e-mailadres"></label><label>Weergave<select name="archived"><option value="0">Actieve klanten</option><option value="1" {{ 'selected' if archived=='1' }}>Archief</option></select></label><button>Zoeken</button></form><div class="columns"><section class="card"><h2>Klantenbestand</h2>{% for c in customers %}<article class="customer"><a href="/customers/{{ c.id }}"><strong>{{ c.name }}</strong></a><p>{{ c.email }} · {{ c.contact }}</p></article>{% else %}<p>Geen klanten gevonden.</p>{% endfor %}</section><section class="card"><h2>Nieuwe klant</h2><form method="post" action="/customers"><input type="hidden" name="csrf" value="{{ csrf }}">{% include 'customer_fields.html' %}<button>Klant opslaan</button></form></section></div>{% endblock %}
