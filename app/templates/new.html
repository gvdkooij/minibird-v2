{% extends 'base.html' %}{% block content %}<h1>{{ 'Nieuwe offerte' if kind=='quote' else 'Nieuwe factuur' }}</h1><section class="card"><p>Controleer de regels vóór opslaan. Concepten kun je verwijderen en opnieuw aanmaken. Nummers worden nooit hergebruikt.</p><form method="post" action="/documents"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="kind" value="{{ kind }}"><label for="customer-select">Klant</label><select id="customer-select" name="customer_id" required><option value="">Kies een klant</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select><label>Vervaldatum<input type="date" name="due" value="{{ due }}" required></label><div id="lines"><fieldset class="line"><legend>Factuurregel</legend><label>Omschrijving<input name="description" required maxlength="500"></label><label>Aantal<input name="quantity" type="number" min="0.001" max="100000" step="0.001" value="1" required></label><label>Prijs excl. btw (€)<input name="price" type="number" min="0" max="10000000" step="0.01" required></label><label>Btw<select name="rate"><option>21</option><option>9</option><option>0</option></select></label><button type="button" class="quiet remove">Regel verwijderen</button></fieldset></div><button type="button" id="add" class="quiet">+ Regel toevoegen</button><button>Concept opslaan</button></form></section><script src="/static/lines.js" defer></script>{% endblock %}
