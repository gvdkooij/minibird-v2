{% extends 'base.html' %}{% block content %}<h1>Klant bewerken</h1><section class="card"><form action="/customers" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ customer.id }}">{% include 'customer_fields.html' %}<button>Wijzigingen opslaan</button></form><div class="actions">{% for action,label in [('restore' if customer.archived else 'archive','Herstellen' if customer.archived else 'Archiveren'),('delete','Verwijderen')] %}<form method="post" action="/customers/{{ customer.id }}/{{ action }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="quiet">{{ label }}</button></form>{% endfor %}</div></section>{% endblock %}
