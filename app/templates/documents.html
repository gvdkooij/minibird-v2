{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">VAN AFSPRAAK NAAR BETALING</p><h1>{{ 'Offertes' if kind=='quote' else 'Facturen' }}</h1></div><a class="button" href="/documents/new?kind={{ kind }}">+ {{ 'Nieuwe offerte' if kind=='quote' else 'Nieuwe factuur' }}</a></div><form class="filters"><input type="hidden" name="kind" value="{{ kind }}"><label>Zoeken<input name="q" value="{{ q }}" placeholder="Nummer of klant"></label><label>Status<select name="status"><option value="">Alle statussen</option>{% for value,label in [('draft','Concept'),('sent','Verzonden'),('accepted','Geaccepteerd'),('paid','Betaald'),('overdue','Verlopen')] %}<option value="{{ value }}" {{ 'selected' if status==value }}>{{ label }}</option>{% endfor %}</select></label><button>Filteren</button></form><section class="card">{% include 'table.html' %}</section>{% endblock %}
